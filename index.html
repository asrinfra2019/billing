<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--muted:#667085;--line:#e3e6eb;--acc:#1d4f9c;--acc2:#eaf1fd;--ok:#1a7f37;--warn:#b54708;--bad:#c62828}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#14213d;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.brand{cursor:pointer;line-height:1.2}
#bizname{font-size:17px;font-weight:700}
#bizname img{height:42px;display:block;background:#fff;padding:4px 8px;border-radius:6px}
#appver{font-size:11px;color:#cfd8ea;margin-top:2px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;color:#cfd8ea;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:#fff;color:#14213d;font-weight:600}
main{max-width:1150px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);flex:1 1 160px}
label.chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
label.chk input{width:auto}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:60px;resize:vertical}
button.b{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.b:hover{border-color:#b9c0cc}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.d{color:var(--bad)}
button.s{padding:4px 9px;font-size:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc}
.n{text-align:right}
td input{padding:5px 6px;min-width:80px}
td textarea{min-height:72px;min-width:320px;padding:5px 6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--acc2);border-radius:8px;padding:12px}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--muted)}
.tag{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.Paid{background:#dafbe1;color:var(--ok)}.Partial{background:#fff4d6;color:var(--warn)}.Unpaid{background:#ffe1e1;color:var(--bad)}
.tot{margin-left:auto;min-width:260px;flex:0 1 320px}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .g{font-weight:700;font-size:16px;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.muted{color:var(--muted)}
.small{font-size:12px}
tr.totrow td{font-weight:700;background:#fafbfc}
summary{cursor:pointer}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1d2330;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;max-width:90vw;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}#toast.err{background:var(--bad)}#toast.ok{background:var(--ok)}
.imgprev{max-height:70px;max-width:200px;border:1px solid var(--line);border-radius:6px;padding:4px;background:#fff}
#print{display:none}
@media screen and (max-width:700px){
  header{padding:8px 12px}
  nav{width:100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  nav button{white-space:nowrap;flex:0 0 auto}
  main{padding:10px}.card{padding:12px;margin-bottom:12px}
  .grid{grid-template-columns:1fr}
  label{flex:1 1 100%}
  input,select,textarea{font-size:16px}
  .tot{margin-left:0;min-width:0;flex:1 1 100%}
  .row.between{gap:8px}
  .stats{grid-template-columns:1fr 1fr}
  table.stk,.stk tbody,.stk tr,.stk td{display:block;width:100%}
  .stk tr:first-child{display:none}
  .stk tr{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px}
  .stk td{border:0;white-space:normal;padding:4px 0;text-align:left!important}
  .stk td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted)}
  .stk td input,.stk td textarea{min-width:0;width:100%}
  .stk td textarea{min-height:84px}
  .stk td:empty{display:none}
  .stk td:last-child{padding-top:8px}
  .hm{display:inline}
}
.hm{display:none}
.ovl{position:fixed;inset:0;background:rgba(20,33,61,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:70px 12px;overflow:auto}
.ovl .card{width:100%;max-width:760px;box-shadow:0 10px 40px rgba(0,0,0,.3);margin:0}
nav button.rf{border:1px solid #475a80}
@media print{
  body{background:#fff}
  header,main,#toast{display:none!important}
  #print{display:block}
  @page{size:A4;margin:0}              /* margin 0 = the browser has no room for its date / title / page-number header and footer */
  #print .doc{padding:0 10mm}
}
/* ---------- printed documents ---------- */
.doc{font:11.5px/1.35 Arial,Helvetica,sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc h1{font-size:20px;margin:0 0 4px}
.doc h3{margin:16px 0 6px;font-size:14px}
.doc table th,.doc table td{border:1px solid #888;white-space:normal;padding:5px 6px;background:none;color:#000}
.doc .two{display:flex;justify-content:space-between;gap:20px;margin-bottom:12px}
.doc .sign{display:flex;justify-content:space-between;margin-top:50px}
.doc .stat{background:#f1f1f1}
.lh-top{display:flex;align-items:center;gap:14px;border-bottom:3px solid #1d4f9c;padding-bottom:6px}
.lh-logo img{height:62px;max-width:215px;display:block;object-fit:contain}
.lh-tag{flex:1;font-weight:800;font-size:16px;line-height:1.3;white-space:pre-line;color:#333;text-transform:uppercase}
.lh-ct{border-left:2px solid #555;padding-left:12px;font-size:13px;line-height:1.5;color:#1d3a6e}
.lh-ct b{color:#1d4f9c;font-size:14px}
.lh-addr{font-size:14px;font-weight:600;color:#333;padding:5px 4px;border-bottom:1px solid #555}
.dtitle{text-align:center;font-weight:700;font-size:15px;margin:12px 0 8px}
.dtitle.invt{margin-top:44px}   /* two blank rows above the invoice title */
.doc .inv{width:100%;border-collapse:collapse;table-layout:fixed}
.doc .inv td,.doc .inv th{border:1px solid #000;padding:3px 6px;vertical-align:top;font-size:11.5px;text-align:left}
.doc .inv th{font-weight:700;text-align:center}
.doc .inv .n{text-align:right}
.doc .inv .k{font-size:11px}
.doc .inv .v{font-weight:700;min-height:14px}
.doc .inv.items{margin-top:-1px}
.doc .inv tr.nb td{border-top:0;border-bottom:0}
.doc .inv td.tl{border-top:1px solid #000}
.pl,.doc .inv td.pl{white-space:pre-line}
.refline{display:flex;justify-content:space-between;font-style:italic;font-weight:700;margin:18px 6px 44px}   /* two blank rows above the title box */
.doc .inv.msr td,.doc .inv.msr th{font-size:12px;vertical-align:top}
.doc .inv.msr .ttl{text-align:center;font-weight:700;font-size:14px;text-decoration:underline}
.doc .inv.msr .ctr{text-align:center}
.doc .inv.msr tr.it td{height:110px}
.doc .inv.msr td.bank{vertical-align:top}
.doc .inv.msr .sg img{max-width:150px;max-height:80px;display:block;margin:2px auto}
.doc .inv.msr .bk{border-collapse:collapse;margin-top:4px}.doc .inv.msr .bk td{border:0;padding:1px 8px 1px 0;font-size:12px}
.signbox{margin-left:auto;width:230px;text-align:center;margin-top:12px}
.signbox img{max-width:150px;max-height:110px;display:block;margin:0 auto 2px}
.doc table.pgw{width:100%;border-collapse:collapse}
.doc table.pgw>thead>tr>td,.doc table.pgw>tfoot>tr>td,.doc table.pgw>tbody>tr>td{border:0;padding:0;background:none;white-space:normal}
.pgw .sp{height:10mm}
.page{page-break-after:always}
.page:last-child{page-break-after:auto}
</style>
</head>

function fixBuyers(list){

  let changed = false;
  (list || []).forEach(p => {
    if(p.id !== 'lt-madp7') return;

const fmtDate = d => d ? d.split('-').reverse().join('-') : '';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const longDate = d => { if(!d) return ''; const [y,m,dd] = d.split('-'); return `${dd}-${MONTHS[m-1]}-${y}`; };

function download(name, text, type='text/csv'){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function words(n){
  n = Math.floor(Math.abs(n)); if(n === 0) return 'Zero';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const t=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two = x => x<20 ? a[x] : t[Math.floor(x/10)] + (x%10 ? ' '+a[x%10] : '');
  const three = x => (x>=100 ? a[Math.floor(x/100)]+' Hundred'+(x%100?' ':'') : '') + (x%100 ? two(x%100) : '');
  const out=[]; const cr=Math.floor(n/1e7); n%=1e7; const l=Math.floor(n/1e5); n%=1e5; const th=Math.floor(n/1e3); n%=1e3;
  if(cr) out.push(words(cr)+(cr>1?' Crores':' Crore')); if(l) out.push(two(l)+(l>1?' Lakhs':' Lakh'));
  if(th) out.push(two(th)+' Thousand'); if(n) out.push(three(n));
  return out.join(' ');
}
function amountWords(n){
  const v = r2(n), rs = Math.floor(v), ps = Math.round((v-rs)*100);
  return 'Indian Rupees ' + words(rs) + (ps ? ' And ' + words(ps) + ' Paisa' : '') + ' Only';
}

// fields that change on every bill
const NOW_F = [['no','Invoice no.'],['date','Dated','date'],['assetCode','Asset code'],['wo','W.O no.'],['orderNo',"Buyer's order no."],['refNo','Reference no. & date'],
  ['otherRef','Other references'],['orderDate','Order dated'],['terms','Mode / terms of payment']];
// fields that stay the same for a buyer (kept in the buyer profile)
const FIX_F = [['customer','Buyer name'],['equipCode','Equipment code'],['vendorCode','Vendor code'],['jobLoc','Job location'],
  ['gstin','GSTIN / UIN'],['bstate','State name'],['bstateCode','State code'],['dispDoc','Dispatched doc no.'],
  ['delivDate','Delivery note date'],['dispThrough','Dispatched through'],['dest','Destination'],['lr','Bill of loading / LR-RR no.'],['delivTerms','Terms of delivery']];
const FIX_TA = [['address','Address / city'],['equip','Equipment details (printed under Destination)']];
const MSR_F = [['workSite','Work site'],['project','Project'],['machine','Machine (e.g. Ex-200)'],['woMonth','Working month line'],['workPeriod','Work period line']];
const PROFILE_KEYS = ['layout','workSite','project','machine','extraNote','noPrefix',...FIX_F.map(f=>f[0]), ...FIX_TA.map(f=>f[0]), 'terms','wo','orderNo','refNo','assetCode','assetCodes','orderNos','woNos','taxType','gstRate'];
const PERS = ['HRS','MONTH','DAYS','NOS','TRIP','KM','CUM','MT'];
const perList = () => `<datalist id="perlist">${PERS.map(p=>`<option value="${p}">`).join('')}</datalist>`;
const blankItem = () => ({desc:'',ref:'',qty:0,rate:0,per:'',amt:'',manual:false});
// amount of a line: typed by you if you entered one, otherwise quantity × rate
const itemAmt = it => it.manual ? num(it.amt) : r2(num(it.qty)*num(it.rate));

function fy(date){ const [y,m] = date.split('-').map(Number); const s = m >= 4 ? y : y-1; return String(s%100).padStart(2,'0')+'-'+String((s+1)%100).padStart(2,'0'); }
function nextNo(date, pre){ const s = db.settings; return (pre || s.prefix) + s.next + (s.fySuffix ? '/' + fy(date) : ''); }
function defMonth(){
  const t = today(), [y,m,d] = t.split('-').map(Number);
  if(d > 10) return t.slice(0,7);
  return m === 1 ? `${y-1}-12` : `${y}-${String(m-1).padStart(2,'0')}`;   // early in the month → bill last month
}
function billCalc(b){
  let sub = 0; for(const it of b.items) sub += itemAmt(it);
  sub = r2(sub);
  const discount = num(b.discount), taxable = r2(sub - discount), rate = b.taxType === 'None' ? 0 : num(b.gstRate);
  let cgst = 0, sgst = 0, igst = 0;
  if(b.taxType === 'IGST') igst = r2(taxable*rate/100); else { cgst = r2(taxable*rate/200); sgst = cgst; }
  const tax = r2(cgst+sgst+igst), total = r2(taxable + tax), paid = r2(num(b.paid)), due = r2(total - paid);
  const status = total > 0 && paid >= total ? 'Paid' : paid > 0 ? 'Partial' : 'Unpaid';
  return {sub, discount, taxable, rate, cgst, sgst, igst, tax, total, paid, due, status};
}
function filteredBills(){
  const q = S.bq.toLowerCase();
  return db.bills.filter(b => (!q || (b.no+' '+b.customer).toLowerCase().includes(q)) && (!S.bvend || b.customer === S.bvend) && (!S.bmonth || String(b.date).startsWith(S.bmonth)))
    .sort((a,b) => b.date.localeCompare(a.date) || b.no.localeCompare(a.no));
}
function statsHtml(){
  const list = filteredBills(), c = list.map(billCalc), sum = k => c.reduce((a,x)=>a+x[k],0);
  return `<div class="stat"><span>Total bills</span><b>${list.length}</b></div>
      <div class="stat"><span>Total billed</span><b>${money(sum('total'))}</b></div>
      <div class="stat"><span>Received</span><b>${money(sum('paid'))}</b></div>
      <div class="stat"><span>Outstanding</span><b>${money(sum('due'))}</b></div>`;
}
function bfilt(){
  const el = $('#blist'); if(el) el.innerHTML = billTable();
  const st = $('#bstats'); if(st) st.innerHTML = statsHtml();
  const n = $('#bcount'); if(n) n.textContent = `(${filteredBills().length} of ${db.bills.length})`;
}
function vendorList(){ return [...new Set([...db.buyers.map(p => p.customer), ...db.bills.map(b => b.customer)].filter(Boolean))]; }
function viewBills(){
  if(editing) return billEditor();

function blankBill(){
  const b = {id:null, buyerId:'', month:'', date:today(), items:[blankItem()], taxType:'CGST+SGST', gstRate:db.settings.gst, discount:0, paid:0, notes:''};
  [...NOW_F, ...FIX_F, ...FIX_TA, ...MSR_F, ['fromDate'], ['toDate'], ['extraNote'], ['layout'], ['noPrefix']].forEach(([k]) => { if(b[k] === undefined) b[k] = ''; });
  b.date = today();
  return b;
}
function applyMonth(b, m){
  const [y,mo] = m.split('-').map(Number), last = new Date(y,mo,0).getDate(), mn = MONTHS[mo-1];
  b.month = m; b.date = `${m}-${String(last).padStart(2,'0')}`;
  b.otherRef = `Billing 01 ${mn} to ${last} ${mn} ${y}`;
  b.orderDate = `01 ${mn} to ${last} ${mn} ${y}`;
  if(b.layout === 'msr'){ b.fromDate = `${m}-01`; b.toDate = b.date; msrRefresh(b); }
}
// MSR: monthly hire is fixed. Per-day rate = monthly ÷ days in the starting month; amount = rate × working days
const dIn = d => new Date(+d.slice(0,4), +d.slice(5,7), 0).getDate();
function msrAmt(it, b){ const m = num(it.monthly), d = num(it.qty); b = b || editing; if(m > 0 && d > 0 && b.fromDate){ const dim = dIn(b.fromDate); it.rate = r2(m/dim); it.amt = r2(m*d/dim); it.manual = true; } }
function msrRefresh(b){
  if(!b.fromDate || !b.toDate) return;
  const keepNo = !b.id && b.no === b.autoNo;
  b.date = b.toDate;                 // invoice date = work end date
  if(keepNo) b.no = b.autoNo = nextNo(b.date, b.noPrefix);
  const f = new Date(b.fromDate+'T00:00'), t = new Date(b.toDate+'T00:00');
  const days = Math.max(0, Math.round((t - f)/86400000) + 1), dmy = d => d.split('-').reverse().join('-');
  const mn = x => MONTHS[+x.slice(5,7)-1], D = x => x.slice(8,10);
  b.woMonth = `Working Month of ${mn(b.fromDate)} : ${D(b.fromDate)} ${mn(b.fromDate)} to ${D(b.toDate)} ${mn(b.toDate)} ${b.toDate.slice(0,4)}`;
  b.workPeriod = `Work Period ${b.machine || ''} Machine from ${dmy(b.fromDate)} to ${dmy(b.toDate)} ${b.project || ''} (Working Days ${days})`;
  (b.items || []).forEach(it => { it.qty = days; it.desc = `Supply of ${b.machine || ''} machine ${mn(b.fromDate)} ${dmy(b.fromDate)} to ${dmy(b.toDate)} working days ${days} days`; msrAmt(it, b); });
}
function msrDate(k, v){ if(!v) return; editing[k] = v; msrRefresh(editing); render(); }
function newBill(){ S.picking = {buyer: db.buyers[0]?.id}; render(); window.scrollTo(0,0); }
function quickBill(id){ view = 'bills'; S.buyer = null; editing = null; S.picking = {buyer:id}; render(); }
function startBill(){
  const p = db.buyers.find(x => x.id === $('#nb_buyer').value), m = $('#nb_month').value;
  const b = blankBill();
  if(p){
    PROFILE_KEYS.forEach(k => { if(p[k] !== undefined) b[k] = structuredClone(p[k]); });
    b.buyerId = p.id;
    b.items = (p.items || []).map(i => ({desc:i.desc, ref:i.ref, qty:0, rate:i.rate, per:i.per, monthly:i.monthly || 0, msr:p.layout === 'msr'}));
    if(!b.items.length) b.items = [blankItem()];
  }
  if(m) applyMonth(b, m);
  b.no = b.autoNo = nextNo(b.date, b.noPrefix);
  S.picking = false; editing = b; render();
}
function setMonth(m){
  if(!m) return;
  const keepNo = editing.no === editing.autoNo;

  if(!editing.id && keepNo) editing.no = editing.autoNo = nextNo(editing.date, editing.noPrefix);

}

function dupBill(id){

}
function delBill(id){

function fld(label, key, type='text', list=''){
  return `<label>${label}<input id="f_${key}" ${list?`list="${list}"`:''} type="${type || 'text'}" ${type==='number'?'step="any" min="0"':''} value="${esc(editing[key])}" oninput="setF('${key}',this.value)"></label>`;
}
function tfld(label, key){ return `<label>${label}<textarea oninput="editing['${key}']=this.value">${esc(editing[key])}</textarea></label>`; }
function setF(k, v){
  if((k === 'fromDate' || k === 'toDate') && v.length === 10) return msrDate(k, v);
  editing[k] = v;
  if(k === 'date' && !editing.id && v && editing.no === editing.autoNo){ editing.no = editing.autoNo = nextNo(v, editing.noPrefix); $('#f_no').value = editing.no; }
  updTot();
}

      ${fld('GST rate %','gstRate','number')}</div>

    <div class="tot" id="tot">${totHtml()}</div></div>

      <button class="b" onclick="saveBill(true)">Save & print</button><button class="b" onclick="editing=null;render()">Cancel</button></div></div>
  <details class="card" ${b.buyerId ? '' : 'open'}><summary><b>Fixed details</b> <span class="muted small">— buyer, asset, destination${b.buyerId ? ' (from the buyer profile)' : ''}</span></summary>
    <div class="grid" style="margin-top:12px">${FIX_F.map(([k,l]) => fld(l,k)).join('')}${FIX_TA.map(([k,l]) => tfld(l,k)).join('')}</div>

function totHtml(){
  const c = billCalc(editing), h = c.rate/2;
  return `<div><span>Subtotal</span><span>${money(c.sub)}</span></div>
    ${c.discount ? `<div><span>Discount</span><span>− ${money(c.discount)}</span></div><div><span>Taxable value</span><span>${money(c.taxable)}</span></div>` : ''}
    ${editing.taxType === 'IGST' ? `<div><span>IGST @${c.rate}%</span><span>${money(c.igst)}</span></div>` :
      editing.taxType === 'None' ? '' : `<div><span>CGST @${h}%</span><span>${money(c.cgst)}</span></div><div><span>SGST @${h}%</span><span>${money(c.sgst)}</span></div>`}
    <div class="g"><span>Total</span><span>${money(c.total)}</span></div>
    <div><span>Received</span><span>${money(c.paid)}</span></div><div style="font-weight:600"><span>Balance due</span><span>${money(c.due)}</span></div>

function updTot(){ const t = $('#tot'); if(t) t.innerHTML = totHtml(); }
function itm(i,k,v){ const it = editing.items[i]; it[k] = v;
  if(editing.layout === 'msr' && num(it.monthly) > 0 && (k === 'qty' || k === 'monthly')){ msrAmt(it, editing); $('#rt'+i).value = it.rate; $('#amt'+i).value = itemAmt(it); } if(!it.manual && (k === 'qty' || k === 'rate')) $('#amt'+i).value = itemAmt(it); updTot(); }
function amtSet(i, v){
  const it = editing.items[i];
  if(String(v).trim() === ''){ it.manual = false; it.amt = ''; $('#amt'+i).value = itemAmt(it); }   // empty box → calculate again
  else { it.manual = true; it.amt = v; }
  updTot();
}
function addItem(){ editing.items.push({...blankItem(), ref:editing.items.at(-1)?.ref || ''}); render(); }
function delItem(i){ editing.items.splice(i,1); if(!editing.items.length) editing.items.push(blankItem()); render(); }
function saveBill(andPrint){
  const b = editing;
  if(!String(b.no).trim()) return alert('Enter an invoice number');
  if(!b.date) return alert('Enter the invoice date');
  if(!String(b.customer).trim()) return alert('Enter the buyer name (in Fixed details)');
  const items = b.items.filter(i => String(i.desc).trim() || num(i.rate));
  if(!items.length) return alert('Add at least one item');
  if(items.some(i => !num(i.qty)) && !confirm('Some lines have quantity 0. Save anyway?')) return;
  if(db.bills.some(x => x.no === b.no && x.id !== b.id)) return alert('That invoice number is already used');
  b.items = items.map(i => ({desc:i.desc, ref:i.ref, qty:num(i.qty), rate:num(i.rate), per:i.per, amt:itemAmt(i), manual:!!i.manual, msr:!!i.msr, monthly:num(i.monthly), hours:String(i.hours ?? '').trim()}));
  b.discount = num(b.discount); b.paid = num(b.paid); b.gstRate = num(b.gstRate);
  const isNew = !b.id, usedAuto = b.no === b.autoNo;
  delete b.autoNo;
  if(isNew){ b.id = uid(); db.bills.push(b); if(usedAuto) db.settings.next++; }
  else db.bills[db.bills.findIndex(x => x.id === b.id)] = b;
  const p = db.buyers.find(x => x.id === b.buyerId);           // remember this month's numbers for next time
  if(p && isNew){ ['wo','orderNo','refNo','terms','assetCode'].forEach(k => p[k] = b[k]); p.assetCodes = choices(b,'assetCode').join(', '); p.orderNos = choices(b,'orderNo').join(', '); p.woNos = choices(b,'wo').join(', '); }
  save(); editing = null; render();
  if(andPrint) printBill(b.id);
  if(p) pushBuyers();
  if(isNew) pushSettings();
  cloudSaveBill(b);
}
function saveProfile(){
  const b = editing;
  if(!String(b.customer).trim()) return alert('Enter the buyer name first');
  let p = db.buyers.find(x => x.id === b.buyerId) || db.buyers.find(x => x.customer === b.customer);
  if(!p){ p = {id:uid()}; db.buyers.push(p); }
  PROFILE_KEYS.forEach(k => p[k] = structuredClone(b[k]));
  p.gstRate = num(p.gstRate);
  p.items = b.items.filter(i => String(i.desc).trim()).map(i => ({desc:i.desc, ref:i.ref, rate:num(i.rate), per:i.per, monthly:num(i.monthly)}));
  b.buyerId = p.id; save(); pushBuyers();
  alert('Buyer profile saved for ' + p.customer); render();
}

// drop-down choices on a bill: the buyer's saved list + values used on earlier bills + this bill's
const PICKS = {assetCode:{list:'assetCodes', fields:['assetCode']}, wo:{list:'woNos', fields:['wo'], noHistory:true}, orderNo:{list:'orderNos', fields:['orderNo']}};
function choices(b, key){
  const P = PICKS[key];
  const p = db.buyers.find(x => x.id === b.buyerId) || db.buyers.find(x => x.customer === b.customer);
  const list = String(p?.[P.list] || '').split(',');
  if(!P.noHistory) db.bills.forEach(x => { if(x.customer === b.customer) P.fields.forEach(f => list.push(x[f])); });
  P.fields.forEach(f => list.push(b[f]));
  return [...new Set(list.map(s => String(s || '').trim()).filter(Boolean))];
}
function pick(label, key){
  const v = editing[key], opts = choices(editing, key);
  return `<label>${label}<select id="f_${key}" onchange="pickSet('${key}',this)">${v ? '' : '<option value="" selected>— select —</option>'}
    ${opts.map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}
    <option value="__new">+ Add new…</option></select></label>`;
}
function pickSet(key, el){
  if(el.value !== '__new'){ editing[key] = el.value; return; }
  const v = prompt('Enter the new value:');
  if(v && v.trim()) editing[key] = v.trim();
  render();
}

function saveBuyer(){
  const p = S.buyer;
  if(!String(p.customer).trim()) return alert('Enter the buyer name');
  if(db.buyers.some(x => x.customer === p.customer && x.id !== p.id)) return alert('A buyer with this name already exists');
  p.gstRate = num(p.gstRate);
  p.items = p.items.filter(i => String(i.desc).trim()).map(i => ({desc:i.desc, ref:i.ref, rate:num(i.rate), per:i.per, monthly:num(i.monthly)}));
  if(!p.id){ p.id = uid(); db.buyers.push(p); } else db.buyers[db.buyers.findIndex(x => x.id === p.id)] = p;
  S.buyer = null; save(); render(); pushBuyers();
}
function delBuyer(id){
  const p = db.buyers.find(x => x.id === id);
  if(confirm(`Delete buyer ${p.customer}? Bills already made for them are kept.`)){ db.buyers = db.buyers.filter(x => x.id !== id); save(); render(); pushBuyers(); }
}

/* ================= SALARY ================= */
const SK = ['basic','hra','allow','gross','pf','esi','pt','ded','net'];
function salCalc(r, wd){
  const f = wd > 0 ? Math.min(num(r.present), wd)/wd : 0;
  const basic=r2(num(r.basic)*f), hra=r2(num(r.hra)*f), allow=r2(num(r.allow)*f), bonus=num(r.bonus);
  const gross = r2(basic+hra+allow+bonus);
  const pf = r2(basic*num(r.pfPct)/100), esi = r2(gross*num(r.esiPct)/100), pt = gross > 0 ? num(r.pt) : 0, adv = num(r.advance);
  const ded = r2(pf+esi+pt+adv);
  return {basic,hra,allow,bonus,gross,pf,esi,pt,adv,ded,net:r2(gross-ded)};
}
function sheetTot(s){
  const t = Object.fromEntries([...SK,'bonus','adv'].map(k=>[k,0]));
  s.rows.forEach(r => { const c = salCalc(r, s.workDays); for(const k in t) t[k] += c[k]; });
  return t;
}

function genSheet(m){
  m = m || $('#smonth').value; if(!m) return;
  const ex = db.sheets.find(s => s.month === m);
  if(ex){ S.sheet = structuredClone(ex); return render(); }
  if(!db.employees.length) return alert('Add employees first');
  const [y,mo] = m.split('-').map(Number), wd = new Date(y,mo,0).getDate();
  S.sheet = {id:null, month:m, workDays:wd, rows:db.employees.map(e => ({empId:e.id, name:e.name, designation:e.designation,
    basic:e.basic, hra:e.hra, allow:e.allow, pfPct:e.pfPct, esiPct:e.esiPct, pt:e.pt, present:wd, bonus:0, advance:0}))};
  render();
}

function fyStart(){ const d = new Date(); const y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear()-1; return y+'-04-01'; }
function balData(){
  return db.bills.filter(b => b.date >= S.bf && b.date <= S.bt && (!S.bc || b.customer === S.bc))
    .map(b => ({b, c:billCalc(b)})).filter(x => !S.bs || x.c.status === S.bs)
    .sort((x,y) => x.b.date.localeCompare(y.b.date) || x.b.no.localeCompare(y.b.no));
}
function sheetsInRange(){ return S.bc || S.bs ? [] : db.sheets.filter(s => s.month >= S.bf.slice(0,7) && s.month <= S.bt.slice(0,7)); }
function balReport(){
  const rows = balData(), sheets = sheetsInRange();
  const T = {total:0,tax:0,paid:0,due:0}; rows.forEach(({c}) => { for(const k in T) T[k] += c[k]; });
  const sal = sheets.reduce((a,s) => a + sheetTot(s).net, 0);
  const cust = {}, mon = {};
  rows.forEach(({b,c}) => {
    const x = cust[b.customer] ||= {n:0,total:0,paid:0,due:0}; x.n++; x.total += c.total; x.paid += c.paid; x.due += c.due;
    const m = mon[b.date.slice(0,7)] ||= {total:0,paid:0,sal:0}; m.total += c.total; m.paid += c.paid;
  });
  sheets.forEach(s => { (mon[s.month] ||= {total:0,paid:0,sal:0}).sal += sheetTot(s).net; });
  return {rows, T, sal, cust, mon, showSal: !S.bc && !S.bs};
}

function setImg(k, file){

const CLOUD_KEY = 'billpay_cloud';                       // web-app URL + secret key, kept only in this browser
const CLOUD_URL = 'https://script.google.com/macros/s/AKfycbwH7m2aK79GuoOswYB20xq7P93yaE8VFyxCttgaiRbythBJP_voEt7WllJal6SRQZnpxQ/exec';   // your Google script link (the secret key is NOT stored in this file)
let cloudCfg = (() => { let c = {}; try{ c = JSON.parse(localStorage.getItem(CLOUD_KEY)) || {}; }catch(e){} return {...c, url:c.url || CLOUD_URL}; })();
const cloudOn = () => !!(cloudCfg.url && cloudCfg.key);
async function cloud(action, data={}){
  let r;
  try{ r = await fetch(cloudCfg.url, {method:'POST', body:JSON.stringify({key:cloudCfg.key, action, ...data})}); }
  catch(e){
    if(!navigator.onLine) throw new Error('no internet connection.');
    throw new Error('the Google script did not answer. Click “Test link”: it should show {"ok":true…}. ' +
      'If it asks you to sign in or shows an error, redeploy with Execute as: Me and Who has access: Anyone, and run “setup” once.' +
      (location.protocol === 'file:' ? ' Also open the app from your GitHub Pages link, not from a file on this computer.' : ''));
  }
  let j; try{ j = await r.json(); }catch(e){ throw new Error('Unexpected reply from Google. Check the web app URL, and that access is set to "Anyone".'); }
  if(!j.ok) throw new Error(j.error || 'Google returned an error');
  return j;
}
function toast(msg, kind=''){
  let t = $('#toast'); if(!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.className = 'show ' + kind;
  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.className = '', kind === 'err' ? 7000 : 3500);
}

function cloudLater(action, data){
  if(!cloudOn()) return;

}

let pdfLib = null;
function loadPdfLib(){
  return pdfLib ||= new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    s.onload = () => res(window.html2pdf);
    s.onerror = () => { pdfLib = null; rej(new Error('could not load the PDF tool (check the internet connection)')); };
    document.head.appendChild(s);
  });
}
async function makePdf(html, landscape=false){
  const lib = await loadPdfLib();
  const els = [document.documentElement, document.body], bg = els.map(e => e.style.background);
  els.forEach(e => e.style.background = '#fff');            // keeps the page grey out of the PDF
  try{
  const uri = await lib().set({margin:10, image:{type:'jpeg', quality:0.96}, html2canvas:{scale:2, backgroundColor:'#ffffff'},
      jsPDF:{unit:'mm', format:'a4', orientation:landscape ? 'landscape' : 'portrait'}, pagebreak:{mode:['css','legacy']}})
    .from(`<div class="doc" style="width:${landscape ? 1000 : 718}px;background:#fff">${html}</div>`).outputPdf('datauristring');
  return uri.slice(uri.indexOf(',') + 1);
  }finally{ els.forEach((e,i) => e.style.background = bg[i]); }
}
async function cloudSaveBill(b){
  if(!cloudOn() || !b) return false;

    const pdf = await makePdf(invoiceHtml(b, 'ORIGINAL FOR RECIPIENT'));
    const r = await cloud('saveBill', {bill:{...b, unsynced:false}, calc:billCalc(b), pdf});
    const x = db.bills.find(y => y.id === b.id);
    if(x){ x.pdfId = r.pdfId; x.pdfUrl = r.pdfUrl; delete x.unsynced; save(); }
    toast(b.no + ' saved to Google ✓', 'ok');
    return true;
  }catch(e){
    const x = db.bills.find(y => y.id === b.id); if(x){ x.unsynced = true; save(); }
    toast('Bill saved here, but not in Google: ' + e.message, 'err');
    return false;
  }finally{ if(view === 'bills' && !editing) render(); }
}
function sheetRows(s){
  return s.rows.map(r => { const c = salCalc(r, s.workDays);
    return [r.name, r.designation, num(r.present), c.basic, c.hra, c.allow, c.bonus, c.gross, c.pf, c.esi, c.pt, c.adv, c.ded, c.net]; });
}
async function cloudSaveSheet(s){

    [db.sheets.find(y => y.id === s.id), S.sheet?.id === s.id ? S.sheet : null].forEach(x => { if(x){ x.pdfId = r.pdfId; x.pdfUrl = r.pdfUrl; } });

    if(view === 'salary') render();
    return true;

}
function cloudDelete(action, id){ if(cloudOn()) cloud(action, {id}).catch(e => toast('Not removed from Google: ' + e.message, 'err')); }
async function cloudLoad(){
  if(!cloudOn()) return;
  try{
    setCloudStatus('Loading from Google…');
    const r = await cloud('load');
    S.cloudLinks = {sheetUrl:r.sheetUrl, folderUrl:r.folderUrl};
    const empty = !r.bills.length && !r.buyers.length && !r.employees.length && !r.sheets.length && !r.settings;
    if(empty){
      const hasData = db.bills.length || db.employees.length || db.sheets.length;
      if(!hasData || confirm('Your Google Sheet is empty. Upload the data saved in this browser to it now?')) await uploadAll(!hasData);
    } else {
      const pending = db.bills.filter(b => b.unsynced && !r.bills.some(x => x.id === b.id));   // saved here while offline
      r.bills.forEach(migrateBill);
      db.bills = r.bills.concat(pending);
      if(r.buyers.length) db.buyers = r.buyers;
      const fixedBuyers = fixBuyers(db.buyers);
      db.employees = r.employees; db.sheets = r.sheets;
      if(r.settings) db.settings = {...BLANK.settings, ...r.settings, logo:db.settings.logo, stamp:db.settings.stamp};
      save(); if(fixedBuyers) pushBuyers();
      for(const b of pending) await cloudSaveBill(b);
    }
    setCloudStatus('Synced with Google Sheet ✓', true);
  }catch(e){
    setCloudStatus('Could not reach Google — using data saved in this browser', false);
    toast('Could not load from Google: ' + e.message, 'err');
  }
  if(!editing && !S.buyer) render();
}

    else { db = load(); toast('Refreshed from this browser'); }
  }finally{ if(bt){ bt.disabled = false; bt.textContent = '↻ Refresh'; } render(); }
}
async function uploadAll(quiet){
  if(!cloudOn()) return;
  try{
    await cloud('saveBuyers', {buyers:db.buyers});
    await cloud('saveEmployees', {employees:db.employees});
    await cloud('saveSettings', {settings:cloudSettings()});
  }catch(e){ return toast('Upload failed: ' + e.message, 'err'); }

  for(const b of [...db.bills]) if(await cloudSaveBill(b)) ok++;
  for(const s of [...db.sheets]) await cloudSaveSheet(s);

}

function cloudCard(){
  const L = S.cloudLinks;
  return `<div class="card" id="cloudCard"><h2>Google Sheets & Drive</h2>
    <p class="muted small">When connected, every bill you save is added to your Google Sheet and its PDF is saved in Google Drive (ASR Billing → Invoices → year → month). Salary sheets are saved the same way. All your devices then share the same data. First set up the script — the steps are at the top of Code.gs.</p>
    <div class="grid"><label>Web app URL (ends with /exec)<input id="c_url" value="${esc(cloudCfg.url || '')}" placeholder="https://script.google.com/macros/s/…/exec"></label>
      <label>Secret key<input id="c_key" type="password" value="${esc(cloudCfg.key || '')}" placeholder="SECRET_KEY from Code.gs"></label></div>
    <div class="row" style="margin-top:12px;align-items:center"><button class="b p" onclick="cloudConnect()">${cloudOn() ? 'Save & reconnect' : 'Connect'}</button>
      <button class="b" onclick="const u=$('#c_url').value.trim(); if(u) window.open(u,'_blank','noopener')">Test link</button>
      ${cloudOn() ? `<button class="b" onclick="cloudLoad()">Load from Google now</button><button class="b" onclick="uploadAll()">Upload everything again</button><button class="b d" onclick="cloudDisconnect()">Disconnect</button>` : ''}
      <span class="small" id="cloudStatus">${esc(S.cloudStatus || '')}</span></div>
    ${L?.sheetUrl ? `<p class="small" style="margin:10px 0 0"><a href="${esc(L.sheetUrl)}" target="_blank" rel="noopener">Open Google Sheet</a> · <a href="${esc(L.folderUrl)}" target="_blank" rel="noopener">Open Drive folder</a></p>` : ''}</div>`;
}
async function cloudConnect(){
  const url = $('#c_url').value.trim(), key = $('#c_key').value.trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) return alert('Paste the Web app URL from Apps Script. It starts with https://script.google.com/');
  if(!key) return alert('Enter the secret key (SECRET_KEY at the top of Code.gs)');
  cloudCfg = {url, key}; try{ localStorage.setItem(CLOUD_KEY, JSON.stringify(cloudCfg)); }catch(e){}
  setCloudStatus('Connecting…');
  try{ await cloud('ping'); await cloudLoad(); }
  catch(e){ setCloudStatus('Could not connect: ' + e.message, false); }
}
function cloudDisconnect(){
  if(!confirm('Stop saving to Google? Everything already in the Sheet and Drive stays there.')) return;
  cloudCfg = {url:CLOUD_URL}; try{ localStorage.removeItem(CLOUD_KEY); }catch(e){}
  S.cloudLinks = null; setCloudStatus('', undefined); S.cloudOk = undefined; render();
}

render();
cloudLoad();
</script>
</body>
</html>
