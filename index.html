<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bills & Payroll</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--muted:#667085;--line:#e3e6eb;--acc:#1d4f9c;--acc2:#eaf1fd;--ok:#1a7f37;--warn:#b54708;--bad:#c62828}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#14213d;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.brand{cursor:pointer;line-height:1.2}
#bizname{font-size:17px;font-weight:700}
#bizname img{height:36px;display:block;background:#fff;padding:2px 6px;border-radius:4px}
#appver{font-size:11px;color:#cfd8ea;margin-top:2px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;color:#cfd8ea;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:#fff;color:#14213d;font-weight:600}
main{max-width:1150px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);flex:1 1 160px}
label.chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
label.chk input{width:auto}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:60px;resize:vertical}
button.b{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
button.b:hover{border-color:#b9c0cc}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.d{color:var(--bad)}
button.s{padding:4px 9px;font-size:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafbfc}
.n{text-align:right}
td input{padding:5px 6px;min-width:80px}
td textarea{min-height:72px;min-width:320px;padding:5px 6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--acc2);border-radius:8px;padding:12px}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--muted)}
.tag{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.Paid{background:#dafbe1;color:var(--ok)}.Partial{background:#fff4d6;color:var(--warn)}.Unpaid{background:#ffe1e1;color:var(--bad)}
.tot{margin-left:auto;min-width:260px;flex:0 1 320px}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .g{font-weight:700;font-size:16px;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.muted{color:var(--muted)}
.small{font-size:12px}
tr.totrow td{font-weight:700;background:#fafbfc}
summary{cursor:pointer}
.imgprev{max-height:70px;max-width:200px;border:1px solid var(--line);border-radius:6px;padding:4px;background:#fff}
#print{display:none}
@media print{
  body{background:#fff}
  header,main{display:none!important}
  #print{display:block}
  @page{size:A4;margin:10mm}
}
/* ---------- printed documents ---------- */
.doc{font:11.5px/1.35 Arial,Helvetica,sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc h1{font-size:20px;margin:0 0 4px}
.doc h3{margin:16px 0 6px;font-size:14px}
.doc table th,.doc table td{border:1px solid #888;white-space:normal;padding:5px 6px;background:none;color:#000}
.doc .two{display:flex;justify-content:space-between;gap:20px;margin-bottom:12px}
.doc .sign{display:flex;justify-content:space-between;margin-top:50px}
.doc .stat{background:#f1f1f1}
.lh-top{display:flex;align-items:center;gap:14px;border-bottom:3px solid #1d4f9c;padding-bottom:6px}
.lh-logo img{max-height:80px;max-width:190px;display:block}
.txtlogo{font:900 32px/1 Arial,sans-serif;color:#1d4f9c;letter-spacing:1px}
.lh-tag{flex:1;font-weight:800;font-size:16px;line-height:1.3;white-space:pre-line;color:#333;text-transform:uppercase}
.lh-ct{border-left:2px solid #555;padding-left:12px;font-size:13px;line-height:1.5;color:#1d3a6e}
.lh-ct b{color:#1d4f9c;font-size:14px}
.lh-addr{font-size:14px;font-weight:600;color:#333;padding:5px 4px;border-bottom:1px solid #555}
.dtitle{text-align:center;font-weight:700;font-size:15px;margin:12px 0 8px}
.doc .inv{width:100%;border-collapse:collapse;table-layout:fixed}
.doc .inv td,.doc .inv th{border:1px solid #000;padding:3px 6px;vertical-align:top;font-size:11.5px;text-align:left}
.doc .inv th{font-weight:700;text-align:center}
.doc .inv .n{text-align:right}
.doc .inv .k{font-size:11px}
.doc .inv .v{font-weight:700;min-height:14px}
.doc .inv.items{margin-top:-1px}
.doc .inv tr.nb td{border-top:0;border-bottom:0}
.doc .inv td.tl{border-top:1px solid #000}
.pl,.doc .inv td.pl{white-space:pre-line}
.signbox{margin-left:auto;width:230px;text-align:center;margin-top:12px}
.signbox img{max-width:150px;max-height:110px;display:block;margin:0 auto 2px}
.page{page-break-after:always}
.page:last-child{page-break-after:auto}
</style>
</head>
<body>
<header>
  <div class="brand" onclick="showVersion()" title="Version history"><div id="bizname">Bills & Payroll</div><div id="appver"></div></div>
  <nav>
    <button data-v="bills" onclick="go('bills')">Bills</button>
    <button data-v="salary" onclick="go('salary')">Salary sheets</button>
    <button data-v="balance" onclick="go('balance')">Balance sheet</button>
    <button data-v="buyers" onclick="go('buyers')">Buyers</button>
    <button data-v="settings" onclick="go('settings')">Settings</button>
  </nav>
</header>
<main></main>
<div id="print"></div>

<script>
/* ---------- storage & helpers ---------- */
const KEY = 'billpay_v1';
const BLANK = {settings:{
  name:'ASR INFRA',
  tagline:'Earth Moving Contractors &\nAll Heavy Machinery Suppliers\nEX-70, EX-200, EX-300 Etc...',
  phone:'98669 62115, 9000262446', email:'asrinfra2019@gmail.com', gstin:'37EJBPS4499P1Z2',
  headAddr:'Gangavaram Port Road, Near Sardar Nest, Gajuwaka, Visakhapatnam - 530 044.',
  address:'Second Floor, 31-24-15/4, Flat No-201,\nSri BVK Towers, Bharath Nagar,\nI.T.I Road, Kurmannapalem,\nVisakhapatnam\nAndhra Pradesh-530046',
  vendorCode:'P12301015590000', udyam:'UDYAM-AP-10-0010457', pan:'EJBPS4499P', state:'Andhra Pradesh', stateCode:'37',
  cur:'₹', prefix:'ASR/VSP/', fySuffix:true, next:15, gst:18, logo:'', stamp:''
}, bills:[], employees:[], sheets:[], buyers:[{
  id:'lt-madp7', customer:'LARSEN AND TOUBRO LTD (0780 MADP7)', equipCode:'Pick & Carry Crane-15T-02724GQH', vendorCode:'S0054635',
  jobLoc:'MADP7', address:'GUNTUR', gstin:'37AAACL0140P1ZI', bstate:'Andhra Pradesh', bstateCode:'37', assetCode:'01352BBH',
  terms:'31 Days', assetCodes:'01352BBH, 01352AUH', orderNos:'LE/LE25M241/WOD/26/000013, LE/LE25M241/WOD/26/000019', woNos:'LE/LE25M241/WOD/26/000013', dispDoc:'', delivDate:'', dispThrough:'', dest:'AMRAVATI MADP7-SECTION 02', lr:'',
  equip:'Excavator 147 HP-20 T\nClass -1.5 cum', delivTerms:'',
  wo:'LE/LE25M241/WOD/26/000013', orderNo:'LE/LE25M241/WOD/26/000019', refNo:'LE/LE25M241/BIL/26001374',
  taxType:'CGST+SGST', gstRate:18,
  items:[
    {desc:'HIRING OF ASSETS- NORMAL HOURS IN A MONTH OF 30 CALENDER DAYS\nItem Code is : 190000000003842', ref:'LE25M241-MADP7', rate:326.92, per:'HRS'},
    {desc:'Miscellaneous Accommodation Charges Only Labour Charges\nITEM CODE: 105681300110065', ref:'LE25M241-MADP7', rate:1500, per:'MONTH'},
    {desc:'Miscellaneous Overtime Charges- In a Month Of 31 Calender Days\nITEM CODE: 190000000001970', ref:'LE25M241-MADP7', rate:228.84, per:'MONTH'}]
}]};

let db = load();
function load(){
  let d; try{ d = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!d) return structuredClone(BLANK);
  let s = {...BLANK.settings, ...d.settings};
  if(d.settings?.name === 'My Business' && !d.settings.tagline) s = {...BLANK.settings, next:d.settings.next || 1};  // old default → new letterhead
  d = {...structuredClone(BLANK), ...d, settings:s};
  d.bills.forEach(migrateBill);
  return d;
}
function migrateBill(b){
  if(b.taxType === undefined){ b.gstRate = num(b.items?.[0]?.tax); b.taxType = b.gstRate ? 'CGST+SGST' : 'None'; }
  (b.items || []).forEach(i => { i.ref ??= ''; i.per ??= ''; delete i.tax; });
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ alert('Could not save data: '+e.message); } }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((n + Number.EPSILON)*100)/100;
const fmt = (n, d=2) => num(n).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const money = n => db.settings.cur + ' ' + fmt(n);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fmtDate = d => d ? d.split('-').reverse().join('-') : '';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const longDate = d => { if(!d) return ''; const [y,m,dd] = d.split('-'); return `${dd}-${MONTHS[m-1]}-${y}`; };
const monthName = m => new Date(m+'-01T00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'});
const csv = rows => '﻿' + rows.map(r => r.map(v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(',')).join('\n');
function download(name, text, type='text/csv'){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function words(n){
  n = Math.floor(Math.abs(n)); if(n === 0) return 'Zero';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const t=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two = x => x<20 ? a[x] : t[Math.floor(x/10)] + (x%10 ? ' '+a[x%10] : '');
  const three = x => (x>=100 ? a[Math.floor(x/100)]+' Hundred'+(x%100?' ':'') : '') + (x%100 ? two(x%100) : '');
  const out=[]; const cr=Math.floor(n/1e7); n%=1e7; const l=Math.floor(n/1e5); n%=1e5; const th=Math.floor(n/1e3); n%=1e3;
  if(cr) out.push(words(cr)+(cr>1?' Crores':' Crore')); if(l) out.push(two(l)+(l>1?' Lakhs':' Lakh'));
  if(th) out.push(two(th)+' Thousand'); if(n) out.push(three(n));
  return out.join(' ');
}
function amountWords(n){
  const v = r2(n), rs = Math.floor(v), ps = Math.round((v-rs)*100);
  return 'Indian Rupees ' + words(rs) + (ps ? ' And ' + words(ps) + ' Paisa' : '') + ' Only';
}
function printDoc(html){ $('#print').innerHTML = '<div class="doc">'+html+'</div>'; setTimeout(()=>window.print(), 300); }
function letterhead(){
  const s = db.settings;
  return `<div class="lh-top"><div class="lh-logo">${s.logo ? `<img src="${s.logo}" alt="">` : `<div class="txtlogo">${esc(s.name)}</div>`}</div>
      <div class="lh-tag">${esc(s.tagline)}</div>
      <div class="lh-ct">${s.phone?'Cell : '+esc(s.phone)+'<br>':''}${s.email?'E-mail : '+esc(s.email)+'<br>':''}${s.gstin?'<b>GSTIN : '+esc(s.gstin)+'</b>':''}</div></div>
    ${s.headAddr ? `<div class="lh-addr">${esc(s.headAddr)}</div>` : ''}`;
}
function bizHead(title, info=''){
  return letterhead() + `<div class="dtitle">${title}</div>${info ? `<div style="text-align:center;margin:-4px 0 10px">${info}</div>` : ''}`;
}

/* ---------- versions ----------
   MAJOR.MINOR.PATCH — small fix/tweak: PATCH (1.0.0 → 1.0.1) · new feature: MINOR (1.0.1 → 1.1.0)
   · change to saved data or backups: MAJOR (1.1.0 → 2.0.0).
   Add a new entry at the TOP of this list for every release. */
const VERSIONS = [
  {v:'1.1.0', date:'2026-10-20', changes:[
    ['Settings','Reset all bills button (keeps buyers, employees, salary sheets and settings; offers a backup first)']]},
  {v:'1.0.0', date:'2026-10-20', changes:[
    ['Bills','ASR Infra tax invoice format (original / duplicate / triplicate)'],
    ['Bills','Buyer profiles with their own item lines — L&T (0780 MADP7)'],
    ['Bills','Billing month fills the date, Other References and Order Dated'],
    ['Bills',"Dropdowns for Asset Code, W.O No. and Buyer's Order No."],
    ['Salary sheets','Employees, monthly salary sheet by paid days, PF / ESI / professional tax, payslips'],
    ['Balance sheet','Bills balance sheet with filters, buyer-wise and month-wise summary, print and CSV'],
    ['Settings','Letterhead, logo and stamp upload, invoice numbering, backup and restore, version history']]},
];
const APP_VERSION = VERSIONS[0].v;
function versionCard(){
  return `<div class="card" id="verCard"><div class="row between"><h2 style="margin:0">Version</h2><b style="font-size:18px">v${APP_VERSION}</b></div>
    <p class="muted small">Small fix → v1.0.1 · new feature → v1.1.0 · change to saved data or backups → v2.0.0</p>
    <div class="tw"><table><tr><th>Version</th><th>Date</th><th>Section</th><th>Change</th></tr>
    ${VERSIONS.map(x => x.changes.map(([sec,note],i) => `<tr>${i ? '<td></td><td></td>' : `<td><b>v${x.v}</b></td><td>${fmtDate(x.date)}</td>`}
      <td>${esc(sec)}</td><td style="white-space:normal">${esc(note)}</td></tr>`).join('')).join('')}</table></div></div>`;
}
function showVersion(){ go('settings'); $('#verCard')?.scrollIntoView({behavior:'smooth'}); }
function renderBrand(){
  const s = db.settings;
  $('#bizname').innerHTML = s.logo ? `<img src="${s.logo}" alt="${esc(s.name)}">` : esc(s.name || 'Bills & Payroll');
  $('#appver').textContent = 'v' + APP_VERSION;
}

/* ---------- app state & routing ---------- */
let view = 'bills';
let editing = null;          // bill being edited
const S = {bq:'', copy:'ORIGINAL FOR RECIPIENT', sheet:null, buyer:null, picking:false, bf:'', bt:'', bc:'', bs:''};
function go(v){ view = v; editing = null; S.buyer = null; S.picking = false; render(); }
function render(){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('main').innerHTML = ({bills:viewBills, buyers:viewBuyers, salary:viewSalary, balance:viewBalance, settings:viewSettings})[view]();
  renderBrand();
  if(view === 'salary' && S.sheet) updSheet();
}

/* ================= BILLS ================= */
// fields that change on every bill
const NOW_F = [['no','Invoice no.'],['date','Dated','date'],['assetCode','Asset code'],['wo','W.O no.'],['orderNo',"Buyer's order no."],['refNo','Reference no. & date'],
  ['otherRef','Other references'],['orderDate','Order dated'],['terms','Mode / terms of payment']];
// fields that stay the same for a buyer (kept in the buyer profile)
const FIX_F = [['customer','Buyer name'],['equipCode','Equipment code'],['vendorCode','Vendor code'],['jobLoc','Job location'],
  ['gstin','GSTIN / UIN'],['bstate','State name'],['bstateCode','State code'],['dispDoc','Dispatched doc no.'],
  ['delivDate','Delivery note date'],['dispThrough','Dispatched through'],['dest','Destination'],['lr','Bill of loading / LR-RR no.'],['delivTerms','Terms of delivery']];
const FIX_TA = [['address','Address / city'],['equip','Equipment details (printed under Destination)']];
const PROFILE_KEYS = [...FIX_F.map(f=>f[0]), ...FIX_TA.map(f=>f[0]), 'terms','wo','orderNo','refNo','assetCode','assetCodes','orderNos','woNos','taxType','gstRate'];
const PERS = ['HRS','MONTH','DAYS','NOS','TRIP','KM','CUM','MT'];
const perList = () => `<datalist id="perlist">${PERS.map(p=>`<option value="${p}">`).join('')}</datalist>`;
const blankItem = () => ({desc:'',ref:'',qty:0,rate:0,per:''});

function fy(date){ const [y,m] = date.split('-').map(Number); const s = m >= 4 ? y : y-1; return String(s%100).padStart(2,'0')+'-'+String((s+1)%100).padStart(2,'0'); }
function nextNo(date){ const s = db.settings; return s.prefix + s.next + (s.fySuffix ? '/' + fy(date) : ''); }
function defMonth(){
  const t = today(), [y,m,d] = t.split('-').map(Number);
  if(d > 10) return t.slice(0,7);
  return m === 1 ? `${y-1}-12` : `${y}-${String(m-1).padStart(2,'0')}`;   // early in the month → bill last month
}
function billCalc(b){
  let sub = 0; for(const it of b.items) sub += num(it.qty)*num(it.rate);
  sub = r2(sub);
  const discount = num(b.discount), taxable = r2(sub - discount), rate = b.taxType === 'None' ? 0 : num(b.gstRate);
  let cgst = 0, sgst = 0, igst = 0;
  if(b.taxType === 'IGST') igst = r2(taxable*rate/100); else { cgst = r2(taxable*rate/200); sgst = cgst; }
  const tax = r2(cgst+sgst+igst), total = r2(taxable + tax), paid = r2(num(b.paid)), due = r2(total - paid);
  const status = total > 0 && paid >= total ? 'Paid' : paid > 0 ? 'Partial' : 'Unpaid';
  return {sub, discount, taxable, rate, cgst, sgst, igst, tax, total, paid, due, status};
}
function viewBills(){
  if(editing) return billEditor();
  const c = db.bills.map(billCalc);
  const sum = k => c.reduce((a,x)=>a+x[k],0);
  return (S.picking ? chooser() : '') + `<div class="stats">
      <div class="stat"><span>Total bills</span><b>${db.bills.length}</b></div>
      <div class="stat"><span>Total billed</span><b>${money(sum('total'))}</b></div>
      <div class="stat"><span>Received</span><b>${money(sum('paid'))}</b></div>
      <div class="stat"><span>Outstanding</span><b>${money(sum('due'))}</b></div></div>
    <div class="card"><div class="row between"><h2 style="margin:0">Bills</h2>
      <div class="row" style="flex:0 1 640px">
        <input style="flex:1 1 200px" placeholder="Search bill no or customer" value="${esc(S.bq)}" oninput="S.bq=this.value;$('#blist').innerHTML=billTable()">
        <select style="flex:0 1 230px" title="Copy printed in the title" onchange="S.copy=this.value">${['ORIGINAL FOR RECIPIENT','DUPLICATE FOR TRANSPORTER','TRIPLICATE FOR SUPPLIER'].map(x=>`<option ${x===S.copy?'selected':''}>${x}</option>`).join('')}</select>
        <button class="b p" style="white-space:nowrap" onclick="newBill()">+ New bill</button></div></div></div>
    <div class="card tw" id="blist">${billTable()}</div>`;
}
function chooser(){
  const sel = S.picking?.buyer;
  return `<div class="card"><h2>New bill</h2>
    <div class="row"><label style="flex:2 1 280px">Buyer<select id="nb_buyer">${db.buyers.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.customer)}</option>`).join('')}
        <option value="">— New buyer (enter details yourself) —</option></select></label>
      <label style="flex:0 1 220px">Billing month<input type="month" id="nb_month" value="${defMonth()}"></label>
      <button class="b p" onclick="startBill()">Continue</button><button class="b" onclick="S.picking=false;render()">Cancel</button></div>
    <p class="muted small" style="margin:8px 0 0">The buyer's fixed details and item lines are filled in. You only enter this month's numbers, quantities and rates.</p></div>`;
}
function billTable(){
  const q = S.bq.toLowerCase();
  const list = db.bills.filter(b => !q || (b.no+' '+b.customer).toLowerCase().includes(q))
    .sort((a,b) => b.date.localeCompare(a.date) || b.no.localeCompare(a.no));
  if(!list.length) return `<p class="muted">${db.bills.length ? 'No bills match your search.' : 'No bills yet. Click “+ New bill” to create one.'}</p>`;
  return `<table><tr><th>Invoice no</th><th>Date</th><th>Buyer</th><th class="n">Total</th><th class="n">Received</th><th class="n">Due</th><th>Status</th><th></th></tr>` +
    list.map(b => { const c = billCalc(b); return `<tr><td>${esc(b.no)}</td><td>${fmtDate(b.date)}</td><td>${esc(b.customer)}</td>
      <td class="n">${money(c.total)}</td><td class="n">${money(c.paid)}</td><td class="n">${money(c.due)}</td><td><span class="tag ${c.status}">${c.status}</span></td>
      <td><button class="b s" onclick="editBill('${b.id}')">Edit</button> <button class="b s" onclick="printBill('${b.id}')">Print</button>

function applyMonth(b, m){
  const [y,mo] = m.split('-').map(Number), last = new Date(y,mo,0).getDate(), mn = MONTHS[mo-1];
  b.month = m; b.date = `${m}-${String(last).padStart(2,'0')}`;
  b.otherRef = `Billing 01 ${mn} to ${last} ${mn} ${y}`;
  b.orderDate = `01 ${mn} to ${last} ${mn} ${y}`;
}

function startBill(){

    b.buyerId = p.id;
    b.items = (p.items || []).map(i => ({desc:i.desc, ref:i.ref, qty:0, rate:i.rate, per:i.per}));

function setMonth(m){

}

function dupBill(id){

function saveBill(andPrint){
  const b = editing;
  if(!String(b.no).trim()) return alert('Enter an invoice number');
  if(!b.date) return alert('Enter the invoice date');
  if(!String(b.customer).trim()) return alert('Enter the buyer name (in Fixed details)');
  const items = b.items.filter(i => String(i.desc).trim() || num(i.rate));
  if(!items.length) return alert('Add at least one item');
  if(items.some(i => !num(i.qty)) && !confirm('Some lines have quantity 0. Save anyway?')) return;
  if(db.bills.some(x => x.no === b.no && x.id !== b.id)) return alert('That invoice number is already used');
  b.items = items.map(i => ({desc:i.desc, ref:i.ref, qty:num(i.qty), rate:num(i.rate), per:i.per}));
  b.discount = num(b.discount); b.paid = num(b.paid); b.gstRate = num(b.gstRate);
  const isNew = !b.id, usedAuto = b.no === b.autoNo;
  delete b.autoNo;
  if(isNew){ b.id = uid(); db.bills.push(b); if(usedAuto) db.settings.next++; }
  else db.bills[db.bills.findIndex(x => x.id === b.id)] = b;
  const p = db.buyers.find(x => x.id === b.buyerId);           // remember this month's numbers for next time
  if(p){ ['wo','orderNo','refNo','terms','assetCode'].forEach(k => p[k] = b[k]); p.assetCodes = choices(b,'assetCode').join(', '); p.orderNos = choices(b,'orderNo').join(', '); p.woNos = choices(b,'wo').join(', '); }
  save(); editing = null; render();
  if(andPrint) printBill(b.id);
}

}

// drop-down choices on a bill: the buyer's saved list + values used on earlier bills + this bill's
const PICKS = {assetCode:{list:'assetCodes', fields:['assetCode']}, wo:{list:'woNos', fields:['wo']}, orderNo:{list:'orderNos', fields:['orderNo']}};
function choices(b, key){
  const P = PICKS[key];
  const p = db.buyers.find(x => x.id === b.buyerId) || db.buyers.find(x => x.customer === b.customer);
  const list = String(p?.[P.list] || '').split(',');
  db.bills.forEach(x => { if(x.customer === b.customer) P.fields.forEach(f => list.push(x[f])); });
  P.fields.forEach(f => list.push(b[f]));
  return [...new Set(list.map(s => String(s || '').trim()).filter(Boolean))];
}
function pick(label, key){
  const v = editing[key], opts = choices(editing, key);
  return `<label>${label}<select id="f_${key}" onchange="pickSet('${key}',this)">${v ? '' : '<option value="" selected>— select —</option>'}
    ${opts.map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}
    <option value="__new">+ Add new…</option></select></label>`;
}
function pickSet(key, el){
  if(el.value !== '__new'){ editing[key] = el.value; return; }
  const v = prompt('Enter the new value:');
  if(v && v.trim()) editing[key] = v.trim();
  render();
}

/* ================= SALARY ================= */
const SK = ['basic','hra','allow','gross','pf','esi','pt','ded','net'];
function salCalc(r, wd){
  const f = wd > 0 ? Math.min(num(r.present), wd)/wd : 0;
  const basic=r2(num(r.basic)*f), hra=r2(num(r.hra)*f), allow=r2(num(r.allow)*f), bonus=num(r.bonus);
  const gross = r2(basic+hra+allow+bonus);
  const pf = r2(basic*num(r.pfPct)/100), esi = r2(gross*num(r.esiPct)/100), pt = gross > 0 ? num(r.pt) : 0, adv = num(r.advance);
  const ded = r2(pf+esi+pt+adv);
  return {basic,hra,allow,bonus,gross,pf,esi,pt,adv,ded,net:r2(gross-ded)};
}
function sheetTot(s){
  const t = Object.fromEntries([...SK,'bonus','adv'].map(k=>[k,0]));
  s.rows.forEach(r => { const c = salCalc(r, s.workDays); for(const k in t) t[k] += c[k]; });
  return t;
}
function viewSalary(){
  const now = today().slice(0,7);
  return `<div class="card"><div class="row between"><h2 style="margin:0">Employees</h2><button class="b p" onclick="addEmp()">+ Add employee</button></div>
      <p class="muted small">Enter full monthly amounts. Salary is prorated by paid days on the sheet. PF is a % of basic; ESI is a % of gross.</p>
      <div class="tw">${db.employees.length ? empTable() : '<p class="muted">No employees yet.</p>'}</div></div>
    <div class="card"><h2>Salary sheet</h2>
      <div class="row"><label style="flex:0 1 220px">Month<input type="month" id="smonth" value="${S.sheet?.month || now}"></label>
      <button class="b p" onclick="genSheet()">Open / generate</button></div>
      ${S.sheet ? sheetEditor() : ''}</div>
    <div class="card"><h2>Saved salary sheets</h2>${savedSheets()}</div>`;
}
function empTable(){
  return `<table><tr><th>Name</th><th>Designation</th><th class="n">Basic</th><th class="n">HRA</th><th class="n">Other allow.</th><th class="n">PF %</th><th class="n">ESI %</th><th class="n">Prof. tax</th><th class="n">Monthly gross</th><th></th></tr>` +
    db.employees.map((e,i)=>`<tr>
      ${['name','designation'].map(k=>`<td><input value="${esc(e[k])}" onchange="setEmp(${i},'${k}',this.value)" style="min-width:140px"></td>`).join('')}
      ${['basic','hra','allow','pfPct','esiPct','pt'].map(k=>`<td><input type="number" step="any" min="0" value="${e[k]}" onchange="setEmp(${i},'${k}',this.value)"></td>`).join('')}
      <td class="n" id="eg${i}">${money(num(e.basic)+num(e.hra)+num(e.allow))}</td>
      <td><button class="b s d" onclick="delEmp(${i})" title="Remove">✕</button></td></tr>`).join('') + '</table>';
}
function setEmp(i,k,v){
  const e = db.employees[i]; e[k] = ['name','designation'].includes(k) ? v : num(v); save();
  $('#eg'+i).textContent = money(num(e.basic)+num(e.hra)+num(e.allow));
}
function addEmp(){ db.employees.push({id:uid(),name:'',designation:'',basic:0,hra:0,allow:0,pfPct:12,esiPct:0,pt:200}); save(); render(); }
function delEmp(i){ if(confirm('Remove '+(db.employees[i].name || 'this employee')+'? Saved salary sheets are not affected.')){ db.employees.splice(i,1); save(); render(); } }
function genSheet(m){
  m = m || $('#smonth').value; if(!m) return;
  const ex = db.sheets.find(s => s.month === m);
  if(ex){ S.sheet = structuredClone(ex); return render(); }
  if(!db.employees.length) return alert('Add employees first');
  const [y,mo] = m.split('-').map(Number), wd = new Date(y,mo,0).getDate();
  S.sheet = {id:null, month:m, workDays:wd, rows:db.employees.map(e => ({empId:e.id, name:e.name, designation:e.designation,
    basic:e.basic, hra:e.hra, allow:e.allow, pfPct:e.pfPct, esiPct:e.esiPct, pt:e.pt, present:wd, bonus:0, advance:0}))};
  render();
}
function sheetEditor(){
  const s = S.sheet;
  return `<div style="margin-top:14px"><div class="row between"><b>${monthName(s.month)} ${s.id ? '<span class="tag Paid">Saved</span>' : '<span class="tag Partial">Not saved</span>'}</b>
      <label style="flex:0 1 200px">Working days in month<input type="number" min="1" value="${s.workDays}" oninput="S.sheet.workDays=num(this.value);updSheet()"></label></div>
    <div class="tw" style="margin-top:10px"><table><tr><th>Employee</th><th class="n">Paid days</th><th class="n">Bonus / OT</th><th class="n">Advance</th>
      <th class="n">Basic</th><th class="n">HRA</th><th class="n">Allow.</th><th class="n">Gross</th><th class="n">PF</th><th class="n">ESI</th><th class="n">Prof. tax</th><th class="n">Deductions</th><th class="n">Net pay</th></tr>
      ${s.rows.map((r,i)=>`<tr><td>${esc(r.name)}<div class="muted small">${esc(r.designation)}</div></td>
        ${['present','bonus','advance'].map(k=>`<td><input type="number" step="any" min="0" value="${r[k]}" oninput="S.sheet.rows[${i}].${k}=this.value;updSheet()"></td>`).join('')}
        ${SK.map(k=>`<td class="n" id="c${i}_${k}"></td>`).join('')}</tr>`).join('')}
      <tr class="totrow"><td>Total</td><td></td><td></td><td></td>${SK.map(k=>`<td class="n" id="ct_${k}"></td>`).join('')}</tr></table></div>
    <div class="row" style="margin-top:12px"><button class="b p" onclick="saveSheet()">Save sheet</button><button class="b" onclick="printSheet()">Print sheet</button>
      <button class="b" onclick="printSlips()">Print payslips</button><button class="b" onclick="sheetCSV()">Export CSV</button>
      <button class="b" onclick="S.sheet=null;render()">Close</button></div></div>`;
}
function updSheet(){
  const s = S.sheet;
  s.rows.forEach((r,i) => { const c = salCalc(r, s.workDays); SK.forEach(k => { const el = $(`#c${i}_${k}`); if(el) el.textContent = money(c[k]); }); });
  const t = sheetTot(s); SK.forEach(k => { const el = $('#ct_'+k); if(el) el.textContent = money(t[k]); });
}
function saveSheet(){
  const s = S.sheet;
  s.rows.forEach(r => ['present','bonus','advance'].forEach(k => r[k] = num(r[k])));
  if(!s.id) s.id = uid();
  db.sheets = db.sheets.filter(x => x.month !== s.month && x.id !== s.id);
  db.sheets.push(structuredClone(s)); save(); render();
}
function savedSheets(){
  if(!db.sheets.length) return '<p class="muted">No saved sheets yet.</p>';
  return `<div class="tw"><table><tr><th>Month</th><th class="n">Employees</th><th class="n">Gross</th><th class="n">Net paid</th><th></th></tr>` +
    [...db.sheets].sort((a,b)=>b.month.localeCompare(a.month)).map(s => { const t = sheetTot(s); return `<tr><td>${monthName(s.month)}</td>
      <td class="n">${s.rows.length}</td><td class="n">${money(t.gross)}</td><td class="n">${money(t.net)}</td>
      <td><button class="b s" onclick="genSheet('${s.month}')">Open</button> <button class="b s d" onclick="delSheet('${s.id}')">Delete</button></td></tr>`; }).join('') + '</table></div>';
}
function delSheet(id){
  const s = db.sheets.find(x => x.id === id);
  if(confirm('Delete salary sheet for '+monthName(s.month)+'?')){ db.sheets = db.sheets.filter(x => x.id !== id); if(S.sheet?.id === id) S.sheet = null; save(); render(); }
}
function printSheet(){
  const s = S.sheet, t = sheetTot(s);
  printDoc(bizHead('SALARY SHEET', `${monthName(s.month)} · Working days: ${s.workDays}`) +
    `<table><tr><th>#</th><th>Employee</th><th>Designation</th><th class="n">Days</th><th class="n">Basic</th><th class="n">HRA</th><th class="n">Allow.</th><th class="n">Bonus</th>
      <th class="n">Gross</th><th class="n">PF</th><th class="n">ESI</th><th class="n">PT</th><th class="n">Advance</th><th class="n">Deductions</th><th class="n">Net pay</th><th>Signature</th></tr>
    ${s.rows.map((r,i)=>{ const c = salCalc(r, s.workDays); return `<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${esc(r.designation)}</td><td class="n">${num(r.present)}</td>
      ${['basic','hra','allow','bonus','gross','pf','esi','pt','adv','ded'].map(k=>`<td class="n">${fmt(c[k])}</td>`).join('')}<td class="n"><b>${fmt(c.net)}</b></td><td style="width:80px"></td></tr>`; }).join('')}
    <tr><td></td><td colspan="3"><b>Total</b></td>${['basic','hra','allow','bonus','gross','pf','esi','pt','adv','ded','net'].map(k=>`<td class="n"><b>${fmt(t[k])}</b></td>`).join('')}<td></td></tr></table>
    <p><b>Total net salary:</b> ${amountWords(t.net)}</p>
    <div class="sign"><div>Prepared by</div><div>Approved by</div></div>`);
}
function printSlips(){
  const s = S.sheet;
  printDoc(s.rows.map(r => { const c = salCalc(r, s.workDays); return `<div class="page">${bizHead('PAYSLIP', monthName(s.month))}
    <div class="two"><div><b>Employee:</b> ${esc(r.name)}<br><b>Designation:</b> ${esc(r.designation)}</div>
      <div style="text-align:right"><b>Working days:</b> ${s.workDays}<br><b>Paid days:</b> ${num(r.present)}</div></div>
    <table><tr><th>Earnings</th><th class="n">Amount</th><th>Deductions</th><th class="n">Amount</th></tr>
      <tr><td>Basic</td><td class="n">${fmt(c.basic)}</td><td>Provident fund</td><td class="n">${fmt(c.pf)}</td></tr>
      <tr><td>HRA</td><td class="n">${fmt(c.hra)}</td><td>ESI</td><td class="n">${fmt(c.esi)}</td></tr>
      <tr><td>Other allowances</td><td class="n">${fmt(c.allow)}</td><td>Professional tax</td><td class="n">${fmt(c.pt)}</td></tr>
      <tr><td>Bonus / OT</td><td class="n">${fmt(c.bonus)}</td><td>Advance</td><td class="n">${fmt(c.adv)}</td></tr>
      <tr><td><b>Gross earnings</b></td><td class="n"><b>${fmt(c.gross)}</b></td><td><b>Total deductions</b></td><td class="n"><b>${fmt(c.ded)}</b></td></tr></table>
    <h3>Net pay: ${money(c.net)}</h3><div>${amountWords(c.net)}</div>
    <div class="sign"><div>Employee signature</div><div>For ${esc(db.settings.name)}</div></div></div>`; }).join(''));
}
function sheetCSV(){
  const s = S.sheet;
  const rows = [['Employee','Designation','Paid days','Basic','HRA','Allowances','Bonus/OT','Gross','PF','ESI','Prof tax','Advance','Deductions','Net pay']];
  s.rows.forEach(r => { const c = salCalc(r, s.workDays); rows.push([r.name,r.designation,num(r.present),c.basic,c.hra,c.allow,c.bonus,c.gross,c.pf,c.esi,c.pt,c.adv,c.ded,c.net]); });
  download(`salary-${s.month}.csv`, csv(rows));
}

/* ================= BALANCE SHEET ================= */
function fyStart(){ const d = new Date(); const y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear()-1; return y+'-04-01'; }
function balData(){
  return db.bills.filter(b => b.date >= S.bf && b.date <= S.bt && (!S.bc || b.customer === S.bc))
    .map(b => ({b, c:billCalc(b)})).filter(x => !S.bs || x.c.status === S.bs)
    .sort((x,y) => x.b.date.localeCompare(y.b.date) || x.b.no.localeCompare(y.b.no));
}
function sheetsInRange(){ return S.bc || S.bs ? [] : db.sheets.filter(s => s.month >= S.bf.slice(0,7) && s.month <= S.bt.slice(0,7)); }
function balReport(){
  const rows = balData(), sheets = sheetsInRange();
  const T = {total:0,tax:0,paid:0,due:0}; rows.forEach(({c}) => { for(const k in T) T[k] += c[k]; });
  const sal = sheets.reduce((a,s) => a + sheetTot(s).net, 0);
  const cust = {}, mon = {};
  rows.forEach(({b,c}) => {
    const x = cust[b.customer] ||= {n:0,total:0,paid:0,due:0}; x.n++; x.total += c.total; x.paid += c.paid; x.due += c.due;
    const m = mon[b.date.slice(0,7)] ||= {total:0,paid:0,sal:0}; m.total += c.total; m.paid += c.paid;
  });
  sheets.forEach(s => { (mon[s.month] ||= {total:0,paid:0,sal:0}).sal += sheetTot(s).net; });
  return {rows, T, sal, cust, mon, showSal: !S.bc && !S.bs};
}
function balHtml(R){
  return `<div class="stats">
      <div class="stat"><span>Bills</span><b>${R.rows.length}</b></div>
      <div class="stat"><span>Total billed</span><b>${money(R.T.total)}</b></div>
      <div class="stat"><span>GST included</span><b>${money(R.T.tax)}</b></div>
      <div class="stat"><span>Received</span><b>${money(R.T.paid)}</b></div>
      <div class="stat"><span>Outstanding</span><b>${money(R.T.due)}</b></div>
      ${R.showSal ? `<div class="stat"><span>Salaries paid</span><b>${money(R.sal)}</b></div>
      <div class="stat"><span>Net (received − salaries)</span><b>${money(R.T.paid - R.sal)}</b></div>` : ''}</div>
    <h3>Customer-wise summary</h3>
    <div class="tw"><table><tr><th>Customer</th><th class="n">Bills</th><th class="n">Billed</th><th class="n">Received</th><th class="n">Outstanding</th></tr>
      ${Object.entries(R.cust).sort((a,b)=>b[1].due-a[1].due).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.n}</td><td class="n">${money(v.total)}</td><td class="n">${money(v.paid)}</td><td class="n">${money(v.due)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">No bills in this period</td></tr>'}
      <tr class="totrow"><td>Total</td><td class="n">${R.rows.length}</td><td class="n">${money(R.T.total)}</td><td class="n">${money(R.T.paid)}</td><td class="n">${money(R.T.due)}</td></tr></table></div>
    <h3>Month-wise summary</h3>
    <div class="tw"><table><tr><th>Month</th><th class="n">Billed</th><th class="n">Received</th>${R.showSal?'<th class="n">Salaries</th><th class="n">Net</th>':''}</tr>
      ${Object.entries(R.mon).sort().map(([k,v])=>`<tr><td>${monthName(k)}</td><td class="n">${money(v.total)}</td><td class="n">${money(v.paid)}</td>
        ${R.showSal?`<td class="n">${money(v.sal)}</td><td class="n">${money(v.paid-v.sal)}</td>`:''}</tr>`).join('') || `<tr><td colspan="5" class="muted">Nothing in this period</td></tr>`}</table></div>
    <h3>Bill ledger</h3>
    <div class="tw"><table><tr><th>Date</th><th>Invoice no</th><th>Customer</th><th class="n">Total</th><th class="n">Received</th><th class="n">Due</th><th>Status</th></tr>
      ${R.rows.map(({b,c})=>`<tr><td>${fmtDate(b.date)}</td><td>${esc(b.no)}</td><td>${esc(b.customer)}</td><td class="n">${money(c.total)}</td><td class="n">${money(c.paid)}</td><td class="n">${money(c.due)}</td><td><span class="tag ${c.status}">${c.status}</span></td></tr>`).join('') || '<tr><td colspan="7" class="muted">No bills</td></tr>'}</table></div>`;
}
function viewBalance(){
  S.bf ||= fyStart(); S.bt ||= today();
  const custs = [...new Set(db.bills.map(b => b.customer))].sort();
  return `<div class="card"><h2>Balance sheet of bills</h2>
    <div class="row"><label>From<input type="date" value="${S.bf}" onchange="S.bf=this.value;render()"></label>
      <label>To<input type="date" value="${S.bt}" onchange="S.bt=this.value;render()"></label>
      <label>Customer<select onchange="S.bc=this.value;render()"><option value="">All customers</option>${custs.map(c=>`<option ${c===S.bc?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}</select></label>
      <label>Status<select onchange="S.bs=this.value;render()">${['','Paid','Partial','Unpaid'].map(s=>`<option value="${s}" ${s===S.bs?'selected':''}>${s||'All'}</option>`).join('')}</select></label></div>
    <div class="row" style="margin-top:12px"><button class="b" onclick="setRange('month')">This month</button><button class="b" onclick="setRange('fy')">This financial year</button>
      <button class="b" onclick="setRange('all')">All time</button><span style="flex:1"></span>
      <button class="b" onclick="printBal()">Print</button><button class="b" onclick="balCSV()">Export CSV</button></div></div>
    <div class="card">${balHtml(balReport())}</div>`;
}
function setRange(k){
  const t = today();
  if(k==='month'){ S.bf = t.slice(0,7)+'-01'; S.bt = t; }
  if(k==='fy'){ S.bf = fyStart(); S.bt = t; }
  if(k==='all'){ S.bf = '2000-01-01'; S.bt = '2100-12-31'; }
  render();
}
function printBal(){
  const filt = [S.bc && 'Customer: '+esc(S.bc), S.bs && 'Status: '+S.bs].filter(Boolean).join(' · ');
  printDoc(bizHead('BALANCE SHEET', `${fmtDate(S.bf)} to ${fmtDate(S.bt)}${filt?' · '+filt:''}`) + balHtml(balReport()));
}
function balCSV(){
  const R = balReport();
  const rows = [['Date','Invoice no','Customer','Subtotal','GST','Discount','Total','Received','Due','Status']];
  R.rows.forEach(({b,c}) => rows.push([fmtDate(b.date),b.no,b.customer,c.sub,c.tax,c.discount,c.total,c.paid,c.due,c.status]));
  rows.push([], ['','','TOTAL','',r2(R.T.tax),'',r2(R.T.total),r2(R.T.paid),r2(R.T.due)]);
  if(R.showSal) rows.push(['','','Salaries paid','','','',r2(R.sal)], ['','','Net (received - salaries)','','','',r2(R.T.paid - R.sal)]);
  download(`balance-sheet-${S.bf}-to-${S.bt}.csv`, csv(rows));
}

/* ================= SETTINGS ================= */
function viewSettings(){
  const s = db.settings;
  const f = (label,k,type='text') => `<label>${label}<input type="${type}" value="${esc(s[k])}" onchange="setS('${k}',this.value)"></label>`;
  const ta = (label,k) => `<label>${label}<textarea onchange="setS('${k}',this.value)">${esc(s[k])}</textarea></label>`;
  const img = (label,k,hint) => `<div><div class="small muted" style="margin-bottom:4px">${label}</div>
    ${s[k] ? `<img class="imgprev" src="${s[k]}" alt=""><br>` : `<p class="small muted" style="margin:0 0 6px">${hint}</p>`}
    <div class="row" style="margin-top:6px"><label class="b" style="flex:0 0 auto;display:inline-block;color:var(--ink);cursor:pointer;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:6px">Upload image<input type="file" accept="image/*" style="display:none" onchange="setImg('${k}',this.files[0])"></label>
    ${s[k] ? `<button class="b s d" onclick="setS('${k}','');render()">Remove</button>` : ''}</div></div>`;
  return `<div class="card"><h2>Letterhead</h2><p class="muted small">Printed at the top of invoices, salary sheets and reports.</p>
    <div class="grid">${f('Business name','name')}${f('Cell','phone')}${f('E-mail','email')}${f('GSTIN','gstin')}</div>
    <div class="grid" style="margin-top:10px">${ta('Tagline (one line per row)','tagline')}${ta('Address line under the header','headAddr')}</div>
    <div class="grid" style="margin-top:12px">${img('Logo','logo','No logo uploaded — the business name is printed instead.')}
      ${img('Stamp / signature','stamp','Printed above “Authorized Signature”. A PNG with a transparent background looks best.')}</div></div>
  <div class="card"><h2>Seller details on invoice</h2>
    <div class="grid">${ta('Office address','address')}${f('Vendor code','vendorCode')}${f('UDYAM no.','udyam')}${f('PAN','pan')}${f('State','state')}${f('State code','stateCode')}</div></div>
  <div class="card"><h2>Invoice numbering & tax</h2>
    <div class="grid">${f('Invoice prefix','prefix')}${f('Next invoice number','next','number')}${f('Default GST rate %','gst','number')}${f('Currency symbol (screens & reports)','cur')}</div>
    <label class="chk" style="margin-top:10px"><input type="checkbox" ${s.fySuffix?'checked':''} onchange="setS('fySuffix',this.checked);render()"> Add financial year at the end (e.g. ${esc(nextNo(today()))})</label></div>
  <div class="card"><h2>Backup</h2>
    <p class="muted small">Data is saved in this browser only. Download a backup regularly, and use it to move your data to another device or browser.</p>
    <div class="row"><button class="b p" onclick="backup()">Download backup</button>
      <label class="b" style="flex:0 0 auto;display:inline-block;color:var(--ink);cursor:pointer;font-size:14px;padding:8px 14px;border:1px solid var(--line);border-radius:6px">Restore from backup<input type="file" accept=".json" style="display:none" onchange="restore(this.files[0])"></label>
      <button class="b d" onclick="resetBills()">Reset all bills</button>
      <button class="b d" onclick="wipe()">Delete all data</button></div></div>
  ${versionCard()}`;
}
function setS(k,v){
  db.settings[k] = k==='next' ? Math.max(1, parseInt(v)||1) : k==='gst' ? num(v) : v;
  save(); renderBrand();
}
function setImg(k, file){
  if(!file) return;
  const rd = new FileReader();
  rd.onload = () => { const im = new Image();
    im.onload = () => { const sc = Math.min(1, 600/Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      db.settings[k] = c.toDataURL('image/png'); save(); render(); };
    im.onerror = () => alert('This image format is not supported by your browser. Please use PNG or JPG.');
    im.src = rd.result; };
  rd.readAsDataURL(file);
}
function backup(){ download(`bills-backup-${today()}.json`, JSON.stringify(db,null,1), 'application/json'); }
function restore(file){
  if(!file) return;
  const rd = new FileReader();
  rd.onload = () => { try{ const d = JSON.parse(rd.result); if(!d.bills || !d.settings) throw new Error('Not a valid backup file');
      if(!confirm('Replace all current data with this backup?')) return;
      db = {...structuredClone(BLANK), ...d, settings:{...BLANK.settings, ...d.settings}}; db.bills.forEach(migrateBill);
      save(); S.sheet = null; render(); alert('Backup restored'); }
    catch(e){ alert('Could not restore: '+e.message); } };
  rd.readAsText(file);
}
function resetBills(){
  const n = db.bills.length;
  if(!n) return alert('There are no bills to reset.');
  if(!confirm(`Delete all ${n} bill(s)? Buyers, employees, salary sheets and settings are kept.`)) return;
  if(confirm('Download a backup of your data first? (Recommended)')) backup();
  db.bills = [];
  const v = prompt('Start invoice numbering again from:', db.settings.next);
  if(v !== null && parseInt(v) > 0) db.settings.next = parseInt(v);
  save(); render(); alert('All bills have been deleted.');
}
function wipe(){ if(confirm('Delete ALL bills, buyers, employees and salary sheets? This cannot be undone.') && confirm('Are you sure?')){ db = structuredClone(BLANK); save(); S.sheet = null; render(); } }

render();
</script>
